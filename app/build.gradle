plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.services)
}

def localSecrets = new Properties()
def localSecretsFile = rootProject.file("local.properties")
if (localSecretsFile.exists()) {
    localSecretsFile.withInputStream { localSecrets.load(it) }
}

def quotedBuildConfigValue = { String key, String fallback ->
    String value = System.getenv(key) ?: localSecrets.getProperty(key, fallback)
    return "\"${value.replace("\\", "\\\\").replace("\"", "\\\"")}\""
}

def mapboxPublicToken = System.getenv("MAPBOX_ACCESS_TOKEN") ?: localSecrets.getProperty("MAPBOX_ACCESS_TOKEN", "")

android {
    namespace 'com.example.proyecto_iot'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.example.proyecto_iot"
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "SUPABASE_URL", quotedBuildConfigValue("SUPABASE_URL", "")
        buildConfigField "String", "SUPABASE_PUBLISHABLE_KEY", quotedBuildConfigValue("SUPABASE_PUBLISHABLE_KEY", "")
        buildConfigField "String", "SUPABASE_BUCKET", quotedBuildConfigValue("SUPABASE_BUCKET", "app-images")
        buildConfigField "String", "SUPABASE_UPLOAD_FUNCTION", quotedBuildConfigValue("SUPABASE_UPLOAD_FUNCTION", "upload-media")
        resValue "string", "mapbox_access_token", mapboxPublicToken
        
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
        resValues true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.mpandroidchart
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.recyclerview
    implementation libs.calendar
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.auth
    implementation libs.firebase.firestore
    implementation libs.firebase.storage
    implementation libs.firebase.functions
    implementation libs.credentials
    implementation libs.credentials.play.services
    implementation libs.googleid
    implementation libs.okhttp
    implementation libs.glide
    implementation libs.zxing.core
    implementation libs.mapbox.maps
    implementation libs.places
    implementation libs.zxing.embedded
    implementation libs.calendar.view
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}

