pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven {
            url = uri("https://api.mapbox.com/downloads/v2/releases/maven")
            credentials {
                username = "mapbox"
                password = providers.gradleProperty("MAPBOX_DOWNLOADS_TOKEN").getOrNull() ?: {
                    def props = new Properties()
                    def f = new File(rootDir, "local.properties")
                    if (f.exists()) props.load(new FileInputStream(f))
                    return props.getProperty("MAPBOX_DOWNLOADS_TOKEN", "")
                }()
            }
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}

rootProject.name = "PROYECTO_IOT"
include ':app'
